---
semantic_colormap_file: $(arg semantic_map_path)
semantic_label_remap_filepath: $(arg semantic_label_remap_filepath)
exit_after_clock: $(arg exit_after_clock)
log_path: $(arg log_path)
log_timing_incrementally: $(arg log_timing_incrementally)
disable_timer_output: $(arg disable_timer_output)
timing_disabled: $(arg timing_disabled)
enable_frontend_output: $(arg enable_frontend_output)
enable_zmq_interface: $(arg enable_zmq_interface)
enable_flow_temporal_module: $(arg enable_flow_temporal_module)
flow_temporal:
  ns: ""
  world_frame: $(arg map_frame)
  observations_topic: $(arg flow_temporal_observations_topic)
  metrics_topic: $(arg flow_temporal_metrics_topic)
  use_detection_stamp_for_tf: $(arg flow_temporal_use_detection_stamp_for_tf)
  publish_metrics: $(arg flow_temporal_publish_metrics)
  min_tsdf_weight_for_visibility: $(arg flow_temporal_min_tsdf_weight_for_visibility)
  worker_rate_hz: $(arg flow_temporal_worker_rate_hz)
  heavy_maintenance_rate_hz: $(arg flow_temporal_heavy_maintenance_rate_hz)
  max_queue_size: $(arg flow_temporal_max_queue_size)
  prediction_horizon_s: $(arg flow_temporal_prediction_horizon_s)
  place_summary_max_nodes: $(arg flow_temporal_place_summary_max_nodes)
  max_components_per_place: $(arg flow_temporal_max_components_per_place)
  component_min_weight: $(arg flow_temporal_component_min_weight)
  deformation_knn: $(arg flow_temporal_deformation_knn)
  deformation_tolerance_s: $(arg flow_temporal_deformation_tolerance_s)
  debug_metrics_nodes_only: $(arg flow_temporal_debug_metrics_nodes_only)
  debug_metrics_max_nodes: $(arg flow_temporal_debug_metrics_max_nodes)
  flow:
    fixed_mu_rho: $(arg flow_temporal_flow_fixed_mu_rho)
    fixed_sigma_theta: $(arg flow_temporal_flow_fixed_sigma_theta)
    fixed_sigma_rho: $(arg flow_temporal_flow_fixed_sigma_rho)
    fixed_sigma_cross: $(arg flow_temporal_flow_fixed_sigma_cross)
    speed_scatter_prior_obs: $(arg flow_temporal_flow_speed_scatter_prior_obs)
    candidate_periods: $(arg flow_temporal_flow_candidate_periods)
    presence_rate_window_s: $(arg flow_temporal_flow_presence_rate_window_s)
    nudft_order: $(arg flow_temporal_flow_nudft_order)
    nudft_min_obs: $(arg flow_temporal_flow_nudft_min_obs)
    visit_gap_s: $(arg flow_temporal_flow_visit_gap_s)
    visit_max_s: $(arg flow_temporal_flow_visit_max_s)
    voxel_size_m: $(arg flow_temporal_flow_voxel_size_m)
    sharing_lent_crossings: $(arg flow_temporal_flow_sharing_lent_crossings)
    weight_uncertainty_noise_sigma: $(arg flow_temporal_flow_weight_uncertainty_noise_sigma)
    edge_coupling_connectivity: $(arg flow_temporal_flow_edge_coupling_connectivity)
    edge_coupling_delta_t_coh: $(arg flow_temporal_flow_edge_coupling_delta_t_coh)
    edge_coupling_samples_per_period: $(arg flow_temporal_flow_edge_coupling_samples_per_period)
    edge_coupling_window_min_pairs: $(arg flow_temporal_flow_edge_coupling_window_min_pairs)
    enable_timing: $(arg flow_temporal_flow_enable_timing)
frontend:
  type: GraphBuilder
  enable_places: $(arg enable_places)
  objects:
    bounding_box_type: $(arg bounding_box_type)
  pose_graph_tracker:
    type: $(arg pose_graph_tracker_type)
backend:
  type: BackendModule
  optimize_on_lc: $(arg optimize_on_lc)
  zmq_sink:
    url: $(arg zmq_send_url)
    send_mesh: $(arg zmq_send_mesh)
  pgmo:
    add_initial_prior: $(arg add_initial_prior)
  update_functors:
    zmq_labels:
      url: $(arg zmq_recv_url)
active_window:
  type: ReconstructionModule
enable_lcd: $(arg enable_dsg_lcd)
lcd_use_bow_vectors: $(arg lcd_use_bow_vectors)
lcd:
  use_gnn_descriptors: $(arg use_gnn_descriptors)
  gnn_lcd:
    object_model_path: $(arg lcd_gnn_object_model)
    places_model_path: $(arg lcd_gnn_places_model)
    label_embeddings_file: $(arg lcd_gnn_label_embeddings)
features:
  type: $(arg feature_receiver_type)
